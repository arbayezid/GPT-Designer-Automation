<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPT Designer</title>
    <link rel="stylesheet" href="./popup.css" />
    <script type="module" src="./popup.js"></script>
  </head>
  <body>
    <main class="shell">
      <!-- Card 1: Header -->
      <header class="panel header-panel">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 12 12 17 22 12"></polyline>
              <polyline points="2 17 12 22 22 17"></polyline>
            </svg>
          </div>
          <h1>GPT Designer</h1>
          <span id="phaseBadge" style="display:none;"><span id="phaseBadgeText"></span></span>
        </div>
        <button id="themeToggle" type="button" class="theme-toggle" aria-label="Toggle theme">
          <svg class="icon theme-icon theme-icon-day" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="icon theme-icon theme-icon-night" viewBox="0 0 24 24"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5Z"/></svg>
        </button>
      </header>

      <!-- Card 2: CONFIGURATION -->
      <section id="chatGptSettings" class="panel config-panel">
        <div class="section-heading">
          <h2>CONFIGURATION</h2>
          <p id="chatGptModeStatus" style="display:none;"></p>
        </div>

        <fieldset id="storageModeField" class="mode-switch">
          <div class="mode-options">
            <input id="modeDrive" type="radio" name="storageMode" value="drive" checked />
            <label for="modeDrive">
              <svg class="icon" viewBox="0 0 24 24"><path d="M17.5 19H9a6 6 0 1 1 5.7-7.85A4.5 4.5 0 1 1 17.5 19Z"/><path d="m10 15 2-4 2 4"/><path d="M11 13h2"/></svg>
              <span>Drive</span>
            </label>
            <input id="modeLocal" type="radio" name="storageMode" value="local" />
            <label for="modeLocal">
              <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5" /><path d="M9 20h6" /><path d="M12 16v4" /></svg>
              <span>Local</span>
            </label>
          </div>
        </fieldset>

        <fieldset id="chatGptModeField" class="mode-switch">
          <div class="mode-options">
            <input id="chatGptModeInstant" type="radio" name="chatGptMode" value="instant" />
            <label for="chatGptModeInstant">
              <svg class="icon" viewBox="0 0 24 24"><path d="M13 2 5 14h6l-1 8 8-12h-6Z" /></svg>
              <span>Instant</span>
            </label>
            <input id="chatGptModeThinking" type="radio" name="chatGptMode" value="thinking" checked />
            <label for="chatGptModeThinking">
              <svg class="icon" viewBox="0 0 24 24"><path d="M9 18h6" /><path d="M10 22h4" /><path d="M8 14a6 6 0 1 1 8 0c-.9.8-1 1.5-1 2H9c0-.5-.1-1.2-1-2Z" /></svg>
              <span>Thinking</span>
            </label>
          </div>
        </fieldset>
        
        <label id="thinkingEffortField" class="field" for="thinkingEffortSelect" style="display:none;">
          <select id="thinkingEffortSelect">
             <option value="light">Light</option>
             <option value="standard">Standard</option>
             <option value="extended" selected>Extended</option>
             <option value="heavy">Heavy</option>
          </select>
        </label>
      </section>

      <!-- Card 3: FILESYSTEM -->
      <section class="panel filesystem-panel mode-panels">
        <div class="section-heading">
          <h2>FILESYSTEM</h2>
          <p id="localPermissionStatus" class="pill-badge" data-status="success">GRANTED</p>
          <p id="oauthStatus" class="pill-badge" style="display:none;"></p>
        </div>

        <div id="driveModePanel" class="mode-panel-drive">
          <label class="field" for="inputFolderId">
            <span class="input-shell">
              <input id="inputFolderId" type="text" placeholder="Enter Drive input folder ID" />
              <button id="pasteInputFolder" type="button" class="field-icon-button"><svg class="icon" viewBox="0 0 24 24"><rect x="8" y="5" width="8" height="4" rx="1"/><path d="M8 7H6.5A1.5 1.5 0 0 0 5 8.5v10A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-10A1.5 1.5 0 0 0 17.5 7H16"/></svg></button>
            </span>
          </label>
          <label class="field" for="outputFolderId">
            <span class="input-shell">
              <input id="outputFolderId" type="text" placeholder="Enter Drive output folder ID" />
              <button id="pasteOutputFolder" type="button" class="field-icon-button"><svg class="icon" viewBox="0 0 24 24"><rect x="8" y="5" width="8" height="4" rx="1"/><path d="M8 7H6.5A1.5 1.5 0 0 0 5 8.5v10A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-10A1.5 1.5 0 0 0 17.5 7H16"/></svg></button>
            </span>
          </label>
        </div>

        <div id="localModePanel" class="mode-panel-local">
          <div class="local-folders">
            <div class="folder-row-new">
              <div class="folder-info">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5Z" /></svg>
                <div class="folder-texts">
                  <span>Input Directory</span>
                  <span id="localInputFolderName" class="folder-name-val"></span>
                  <span id="localInputPermissionStatus" style="display:none;"></span>
                </div>
              </div>
              <button id="chooseInputFolder" type="button" class="select-btn">Select</button>
            </div>
            
            <div class="folder-row-new">
              <div class="folder-info">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5Z" /></svg>
                <div class="folder-texts">
                  <span>Output Directory</span>
                  <span id="localOutputFolderName" class="folder-name-val"></span>
                  <span id="localOutputPermissionStatus" style="display:none;"></span>
                </div>
              </div>
              <button id="chooseOutputFolder" type="button" class="select-btn">Select</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Card 4: Actions -->
      <section class="panel actions-panel">
        <div class="row">
          <button id="saveSettings" type="button" class="action-button">
            <svg class="icon" viewBox="0 0 24 24"><path d="M5 3h12l2 2v16H5Z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/></svg>
            Save
          </button>
          <button id="listSets" type="button" class="action-button">
            <svg class="icon" viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
            Sets
          </button>
        </div>
        
        <div class="field-select-profile">
          <label for="setSelect">Profile: </label>
          <div class="select-shell-inline">
            <select id="setSelect"><option value="">All sets</option></select>
            <svg class="icon chevron-icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>

        <div class="row mt-12">
          <button id="startJob" type="button" class="primary">
            <svg class="icon fill-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z" stroke="none" /></svg>
            Start
          </button>
          <button id="stopJob" type="button" class="danger">
            <svg class="icon fill-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1" stroke="none"/></svg>
            Stop
          </button>
        </div>
        <p id="currentStep" style="display:none;"></p>
      </section>

      <!-- Card 5: ACTIVITY LOG -->
      <section id="logPanel" class="panel log-panel">
        <div class="log-header-row">
          <h2>ACTIVITY LOG</h2>
          <button id="clearLog" type="button" class="icon-button trash-btn">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6 18 20H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/></svg>
          </button>
          <button id="logToggle" style="display:none;"><span id="logToggleLabel"></span></button>
        </div>
        <ol id="logList" class="logs"></ol>
      </section>
    </main>
  </body>
</html>
